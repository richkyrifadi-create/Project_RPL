services:
  mysql:
    image: mysql:8.4
    container_name: praditacare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: praditacare
      MYSQL_USER: praditacare
      MYSQL_PASSWORD: praditacare
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
