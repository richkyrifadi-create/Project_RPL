# Nginx yang terpasang langsung di server (tanpa Docker), untuk instalasi dengan systemd.
# Salin ke /etc/nginx/sites-available/praditacare lalu aktifkan (lihat docs/deployment/).
# Aplikasi Node berjalan di 127.0.0.1:4000 (deploy/systemd/praditacare.service).

server {
    listen 80;
    # Aktifkan bila server punya IPv6: listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # Aktifkan bila server punya IPv6: listen [::]:443 ssl;
    server_name _;

    # Self-signed (deploy/scripts/buat-sertifikat.sh) atau Let's Encrypt:
    #   ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    ssl_certificate     /etc/nginx/ssl/praditacare/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/praditacare/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 30m;
    server_tokens off;

    location = / {
        return 302 /praditacare/;
    }

    location = /praditacare {
        return 301 /praditacare/;
    }

    location /praditacare/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /praditacare;
        proxy_read_timeout 60s;
    }
}
