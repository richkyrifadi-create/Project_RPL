# Nginx di dalam Docker (deploy/docker-compose.prod.yml).
# Aplikasi diakses di https://<ip>/praditacare/ dan diteruskan ke container "app" port 4000.

server {
    listen 80;
    server_name _;

    # Untuk verifikasi Let's Encrypt (opsional, bila memakai domain).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Upload lampiran: maksimal 5 file x 5 MB per permintaan.
    client_max_body_size 30m;
    server_tokens off;

    # Halaman root mengarahkan reviewer ke aplikasi.
    location = / {
        return 302 /praditacare/;
    }

    location = /praditacare {
        return 301 /praditacare/;
    }

    # Awalan /praditacare dibuang sebelum diteruskan: /praditacare/api/health -> app:4000/api/health
    location /praditacare/ {
        proxy_pass http://app:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /praditacare;
        proxy_read_timeout 60s;
    }
}
