# Stack produksi PraditaCare: MariaDB + aplikasi Node + Nginx (HTTPS, sub-path /praditacare).
# Pemakaian (dari folder praditacare/):
#   cp deploy/.env.production.example deploy/.env   # lalu isi
#   bash deploy/scripts/buat-sertifikat.sh <IP-atau-domain>
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: praditacare

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: praditacare
      MARIADB_USER: praditacare
      MARIADB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di deploy/.env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Database tidak dibuka ke luar server.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${BASE_PATH:-/praditacare/}
    image: praditacare-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://praditacare:${DB_PASSWORD}@db:3306/praditacare
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di deploy/.env}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: https://${PUBLIC_HOST:?isi PUBLIC_HOST di deploy/.env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      MAX_UPLOAD_MB: 5
    volumes:
      - uploads:/data/uploads
    # Port 4000 hanya terlihat di jaringan internal Docker; akses publik lewat Nginx.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/praditacare-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  db-data:
  uploads:
